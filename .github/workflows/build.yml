name: Build Portable Packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: '3.11'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: agentscope-ai/QwenPaw
          ref: ${{ inputs.tag }}
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: 'source/**/pyproject.toml'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "=== Build Environment ==="
          python --version
          node --version
          $PythonDir = (Get-Command python).Source | Split-Path
          Write-Host "Python dir: $PythonDir"
          Write-Host "Upstream tag: ${{ inputs.tag }}"
          Write-Host "Version: ${{ inputs.version }}"

      - name: Install Python dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install .[full]

      - name: Create portable package structure
        shell: pwsh
        working-directory: source
        run: |
          $Version = "${{ inputs.version }}"
          $PortableDir = "qwenpaw-portable"

          New-Item -ItemType Directory -Path "$PortableDir\runtime" -Force | Out-Null
          New-Item -ItemType Directory -Path "$PortableDir\app" -Force | Out-Null
          New-Item -ItemType Directory -Path "$PortableDir\scripts" -Force | Out-Null

          # Copy application files
          @("pyproject.toml", "setup.py", "setup.cfg", "MANIFEST.in") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ "$PortableDir\app\" -Force }
          }
          @("qwenpaw", "scripts", "resources", "assets", "docs") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ "$PortableDir\app\" -Recurse -Force }
          }

          Write-Host "Application files copied."

      - name: Copy Python runtime
        shell: pwsh
        working-directory: source
        run: |
          $PortableDir = "qwenpaw-portable"

          # Find the Python installation directory
          $PythonExe = (Get-Command python).Source
          $PythonDir = Split-Path $PythonExe
          Write-Host "Source Python dir: $PythonDir"

          # Copy entire Python installation
          $TargetDir = "$PortableDir\runtime"
          Write-Host "Copying Python to $TargetDir..."
          Copy-Item -Path "$PythonDir\*" -Destination $TargetDir -Recurse -Force

          # Remove unnecessary items to reduce package size
          $RemoveDirs = @("tcl", "include", "Doc", "Tools", "libs")
          foreach ($d in $RemoveDirs) {
            $p = Join-Path $TargetDir $d
            if (Test-Path $p) { Remove-Item $p -Recurse -Force; Write-Host "Removed: $d" }
          }

          # Clean up cache and test files
          Get-ChildItem -Path $TargetDir -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Get-ChildItem -Path "$TargetDir\Lib" -Directory -Filter "test" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Get-ChildItem -Path "$TargetDir\Lib\test" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

          # Remove pip/wheel/setuptools cache from runtime (not needed at runtime)
          @("Lib\site-packages\pip", "Lib\site-packages\wheel", "Lib\site-packages\setuptools", "Lib\site-packages\_distutils_hack") | ForEach-Object {
            $p = Join-Path $TargetDir $_
            if (Test-Path $p) { Remove-Item $p -Recurse -Force; Write-Host "Removed: $_" }
          }

          # Remove .dist-info RECORD files (large metadata)
          Get-ChildItem -Path "$TargetDir\Lib\site-packages" -Directory -Filter "*.dist-info" | ForEach-Object {
            $record = Join-Path $_.FullName "RECORD"
            if (Test-Path $record) { Remove-Item $record -Force }
          }

          # Verify
          $FinalPython = Join-Path $TargetDir "python.exe"
          if (Test-Path $FinalPython) {
            Write-Host "Python runtime copied successfully."
            $Size = (Get-ChildItem $TargetDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host "Runtime size: $([math]::Round($Size, 2)) MB"
          } else {
            Write-Error "python.exe not found in runtime directory!"
            exit 1
          }

      - name: Create scripts
        shell: pwsh
        working-directory: source
        run: |
          $PortableDir = "qwenpaw-portable"

          # Main entry script - with UAC elevation
          $MainScript = @"
          @echo off
          title QwenPaw
          setlocal enabledelayedexpansion

          :: Auto-elevate to admin
          net session >nul 2>&1
          if !errorLevel! neq 0 (
              echo Requesting administrator privileges...
              powershell -Command "Start-Process '%~f0' -Verb RunAs"
              exit /b
          )

          set "SCRIPT_DIR=%~dp0"
          set "PYTHON=%SCRIPT_DIR%runtime\python.exe"
          set "APP=%SCRIPT_DIR%app"

          cd /d "!APP!"
          "!PYTHON!" -m qwenpaw %*
          if !errorLevel! neq 0 (
              echo.
              echo [QwenPaw] Error occurred. Press any key to exit...
              pause >nul
          )
          "@
          $MainScript | Out-File "qwenpaw-portable\qwenpaw.bat" -Encoding ASCII

          # App startup script
          $AppScript = @"
          @echo off
          title QwenPaw App
          set "SCRIPT_DIR=%~dp0"
          set "PYTHON=%SCRIPT_DIR%runtime\python.exe"
          set "APP=%SCRIPT_DIR%app"

          cd /d "%APP%"
          "!PYTHON!" -m qwenpaw app
          "@
          $AppScript | Out-File "qwenpaw-portable\scripts\app.bat" -Encoding ASCII

          Write-Host "Scripts created."

      - name: Create zip
        shell: bash
        working-directory: source
        run: |
          ZIP="qwenpaw-portable-win-x64-v${{ inputs.version }}.zip"
          7z a -tzip "$ZIP" qwenpaw-portable/* -mx=7
          ls -lh "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: source/qwenpaw-portable-win-x64-*.zip
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: agentscope-ai/QwenPaw
          ref: ${{ inputs.tag }}
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: 'source/**/pyproject.toml'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CPU-only PyTorch first
        working-directory: source
        run: |
          echo "Installing CPU-only PyTorch to avoid CUDA bloat..."
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          echo "CPU-only torch installed."

      - name: Install Python dependencies
        working-directory: source
        run: |
          pip install ".[full]"

      - name: Create and fill portable package
        shell: bash
        working-directory: source
        run: |
          DIR="qwenpaw-portable-linux"
          mkdir -p "$DIR/app" "$DIR/runtime" "$DIR/scripts"

          # Copy application files
          for f in pyproject.toml setup.py setup.cfg MANIFEST.in; do
            [ -f "$f" ] && cp "$f" "$DIR/app/"
          done
          for d in qwenpaw scripts resources assets docs; do
            [ -d "$d" ] && cp -r "$d" "$DIR/app/"
          done

          echo "Application files copied."

          # Find Python installation directory
          PYTHON_FULL=$(which python)
          PYTHON_FULL=$(readlink -f "$PYTHON_FULL" 2>/dev/null || echo "$PYTHON_FULL")
          PYTHON_DIR=$(dirname "$PYTHON_FULL")
          PYTHON_ROOT=$(dirname "$PYTHON_DIR")
          if [ ! -d "$PYTHON_ROOT/lib" ]; then
            PYTHON_ROOT=$(dirname "$PYTHON_ROOT")
          fi

          echo "Source Python root: $PYTHON_ROOT"

          # Copy entire Python installation
          cp -rL "$PYTHON_ROOT/"* "$DIR/runtime/" 2>/dev/null || cp -r "$PYTHON_ROOT/"* "$DIR/runtime/"

          # Aggressive cleanup to reduce size
          echo "Cleaning up..."
          for d in include Doc Tools share man; do
            [ -d "$DIR/runtime/$d" ] && rm -rf "$DIR/runtime/$d" && echo "Removed: $d"
          done
          find "$DIR/runtime" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$DIR/runtime" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find "$DIR/runtime" -name "*.pyc" -delete 2>/dev/null || true
          find "$DIR/runtime" -name "*.pyo" -delete 2>/dev/null || true

          # Remove pip/wheel/setuptools from runtime (not needed at runtime)
          for pkg in pip wheel setuptools _distutils_hack; do
            p="$DIR/runtime/lib/python"*/site-packages/$pkg
            [ -d "$p" ] && rm -rf "$p" && echo "Removed: $pkg"
          done

          # Remove RECORD files from dist-info (large metadata)
          find "$DIR/runtime" -path "*/dist-info/RECORD" -delete 2>/dev/null || true

          # Fix shebangs in bin/ scripts
          if [ -d "$DIR/runtime/bin" ]; then
            echo "Fixing shebangs..."
            for script in "$DIR/runtime/bin/"*; do
              if file "$script" 2>/dev/null | grep -q "text"; then
                sed -i "1s|^#!.*python.*|#!/usr/bin/env python3|" "$script" 2>/dev/null || true
              fi
            done
          fi

          # Create wrapper scripts
          cat > "$DIR/qwenpaw.sh" << 'SCRIPTEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PYTHONHOME="$SCRIPT_DIR/runtime"
          export PYTHONPATH="$SCRIPT_DIR/app"
          cd "$SCRIPT_DIR/app"
          exec "$SCRIPT_DIR/runtime/bin/python3" -m qwenpaw "$@"
          SCRIPTEOF
          chmod +x "$DIR/qwenpaw.sh"

          cat > "$DIR/scripts/app.sh" << 'SCRIPTEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PYTHONHOME="$SCRIPT_DIR/../runtime"
          export PYTHONPATH="$SCRIPT_DIR/../app"
          cd "$SCRIPT_DIR/../app"
          exec "$SCRIPT_DIR/../runtime/bin/python3" -m qwenpaw app
          SCRIPTEOF
          chmod +x "$DIR/scripts/app.sh"

          # Verify Python works
          echo "Verifying Python..."
          "$DIR/runtime/bin/python3" --version || echo "WARNING: Python verification failed"

          # Show package size before compression
          echo "Package size before compression:"
          du -sh "$DIR"

          # Create tarball using 7z for better compression
          TARBALL="qwenpaw-portable-linux-x64-v${{ inputs.version }}.tar.gz"
          7z a -tgzip "$TARBALL" "$DIR" -mx=7
          ls -lh "$TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: source/qwenpaw-portable-linux-x64-*.tar.gz
          retention-days: 5

  release:
    name: Publish release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Fetch upstream release body
        id: upstream
        run: |
          BODY=$(curl -s https://api.github.com/repos/agentscope-ai/QwenPaw/releases/tags/${{ inputs.tag }} \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))" 2>/dev/null || echo "")
          echo "$BODY" > upstream_body.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "QwenPaw Portable v${{ inputs.version }}"
          body: |
            > Based on upstream [agentscope-ai/QwenPaw ${{ inputs.tag }}](https://github.com/agentscope-ai/QwenPaw/releases/tag/${{ inputs.tag }})

            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows x64 | `qwenpaw-portable-win-x64-v${{ inputs.version }}.zip` |
            | Linux x64 | `qwenpaw-portable-linux-x64-v${{ inputs.version }}.tar.gz` |

            ## Usage

            **Windows:** Extract zip, run `qwenpaw.bat`

            **Linux:** Extract tar.gz, run `./qwenpaw-portable-linux/qwenpaw.sh`

            ## Note

            The portable package includes **CPU-only PyTorch**. For GPU acceleration on Linux, install CUDA PyTorch after extracting:
            ```bash
            ./runtime/bin/pip install torch --index-url https://download.pytorch.org/whl/cu121
            ```

            ---
            ⚠️ This is an automated portable build. For full details, visit the [upstream release page](https://github.com/agentscope-ai/QwenPaw/releases/tag/${{ inputs.tag }}).
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
