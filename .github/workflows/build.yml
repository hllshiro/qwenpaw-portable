name: Build Portable Packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: '3.11'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: agentscope-ai/QwenPaw
          ref: ${{ inputs.tag }}
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "=== Build Environment ==="
          python --version
          node --version
          Write-Host "Upstream tag: ${{ inputs.tag }}"
          Write-Host "Version: ${{ inputs.version }}"

      - name: Install Python dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install -e .[full]
          pip install conda-pack

      - name: Create portable package
        shell: pwsh
        working-directory: source
        run: |
          $Version = "${{ inputs.version }}"
          $PortableDir = "qwenpaw-portable"

          New-Item -ItemType Directory -Path "$PortableDir\runtime" -Force | Out-Null
          New-Item -ItemType Directory -Path "$PortableDir\app" -Force | Out-Null
          New-Item -ItemType Directory -Path "$PortableDir\scripts" -Force | Out-Null

          # Copy application files
          @("pyproject.toml", "setup.py", "setup.cfg") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ "$PortableDir\app\" -Force }
          }
          @("qwenpaw", "scripts", "resources", "assets") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ "$PortableDir\app\" -Recurse -Force }
          }

          Write-Host "Application files copied."

      - name: Pack Python environment
        shell: pwsh
        working-directory: source
        run: |
          # Get Python location
          $PythonPath = (Get-Command python).Source | Split-Path
          $PortableDir = "qwenpaw-portable"

          # Pack Python environment
          Write-Host "Packing Python environment..."
          conda-pack -p "$PythonPath" -o "$PortableDir\runtime\python-pack.tar.gz" --force

          # Extract Python
          Write-Host "Extracting Python..."
          cd "$PortableDir\runtime"
          tar -xzf python-pack.tar.gz
          Remove-Item python-pack.tar.gz

          # Activate and install dependencies
          Write-Host "Installing dependencies..."
          & ".\python.exe" -m pip install --upgrade pip
          & ".\python.exe" -m pip install -e "..\app\[full]"
          cd ../..

          Write-Host "Python environment ready."

      - name: Create scripts
        shell: pwsh
        working-directory: source
        run: |
          $PortableDir = "qwenpaw-portable"

          # Main entry script
          @"
          @echo off
          title QwenPaw
          setlocal enabledelayedexpansion
          set "SCRIPT_DIR=%~dp0"
          set "PYTHON=%SCRIPT_DIR%runtime\python.exe"
          set "APP=%SCRIPT_DIR%app"

          cd /d "%APP%"
          "%PYTHON%" -m qwenpaw %*
          if !errorLevel! neq 0 (
              echo.
              echo [QwenPaw] Error occurred. Press any key to exit...
              pause >nul
          )
          "@ | Out-File "qwenpaw-portable\qwenpaw.bat" -Encoding ASCII

          # App startup script
          @"
          @echo off
          title QwenPaw App
          set "SCRIPT_DIR=%~dp0"
          set "PYTHON=%SCRIPT_DIR%runtime\python.exe"
          set "APP=%SCRIPT_DIR%app"

          cd /d "%APP%"
          "%PYTHON%" -m qwenpaw app
          "@ | Out-File "qwenpaw-portable\scripts\app.bat" -Encoding ASCII

          Write-Host "Scripts created."

      - name: Create zip
        shell: bash
        working-directory: source
        run: |
          ZIP="qwenpaw-portable-win-x64-v${{ inputs.version }}.zip"
          7z a -tzip "$ZIP" qwenpaw-portable/* -mx=7
          ls -lh "$ZIP"
          echo "$ZIP" > ../artifact-win.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: source/qwenpaw-portable-win-x64-*.zip
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: agentscope-ai/QwenPaw
          ref: ${{ inputs.tag }}
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: source
        run: |
          pip install -e .[full]
          pip install conda-pack

      - name: Create portable package
        shell: bash
        working-directory: source
        run: |
          DIR="qwenpaw-portable-linux"
          mkdir -p "$DIR/app" "$DIR/scripts"

          # Copy application files
          cp pyproject.toml setup.py setup.cfg "$DIR/app/" 2>/dev/null || true
          cp -r qwenpaw scripts resources assets "$DIR/app/" 2>/dev/null || true

          # Pack Python
          PYTHON_PATH=$(dirname $(dirname $(which python)))
          conda-pack -p "$PYTHON_PATH" -o "$DIR/runtime/python-pack.tar.gz" --force

          # Extract
          mkdir -p "$DIR/runtime"
          cd "$DIR/runtime"
          tar -xzf python-pack.tar.gz
          rm python-pack.tar.gz

          # Install dependencies
          ./bin/python -m pip install --upgrade pip
          ./bin/python -m pip install -e "../app/[full]"
          cd ../..

          # Scripts
          cat > "$DIR/qwenpaw.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$DIR/app"
          "$DIR/runtime/bin/python" -m qwenpaw "$@"
          EOF
          chmod +x "$DIR/qwenpaw.sh"

          cat > "$DIR/scripts/app.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/.."
          cd "$DIR/app"
          "$DIR/runtime/bin/python" -m qwenpaw app
          EOF
          chmod +x "$DIR/scripts/app.sh"

          TARBALL="qwenpaw-portable-linux-x64-v${{ inputs.version }}.tar.gz"
          tar -czf "$TARBALL" "$DIR"
          ls -lh "$TARBALL"
          echo "$TARBALL" > ../artifact-linux.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: source/qwenpaw-portable-linux-x64-*.tar.gz
          retention-days: 5

  release:
    name: Publish release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Fetch upstream release body
        id: upstream
        run: |
          BODY=$(curl -s https://api.github.com/repos/agentscope-ai/QwenPaw/releases/tags/${{ inputs.tag }} \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))" 2>/dev/null || echo "")
          echo "$BODY" > upstream_body.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "QwenPaw Portable v${{ inputs.version }}"
          body: |
            > Based on upstream [agentscope-ai/QwenPaw ${{ inputs.tag }}](https://github.com/agentscope-ai/QwenPaw/releases/tag/${{ inputs.tag }})

            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows x64 | `qwenpaw-portable-win-x64-v${{ inputs.version }}.zip` |
            | Linux x64 | `qwenpaw-portable-linux-x64-v${{ inputs.version }}.tar.gz` |

            ---

            ${{ steps.upstream.outputs.tag != '' && format('> See upstream release notes: https://github.com/agentscope-ai/QwenPaw/releases/tag/{0}', inputs.tag) || '' }}

            ---
            ⚠️ This is an automated portable build. For full details, visit the [upstream release page](https://github.com/agentscope-ai/QwenPaw/releases/tag/${{ inputs.tag }}).
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
